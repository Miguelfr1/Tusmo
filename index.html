<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#193d36" />
    <meta
      name="description"
      content="Six essais pour trouver le bon mot. Explore les 1 025 Pokémon, découvre des cartes immersives et défie tes amis sur Tusmo."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tusmo · Attrape le bon mot</title>
    <style>
      /* Painted before a single byte of JavaScript arrives: opening an
         activity takes a few seconds, and a blank frame reads as a crash. */
      #tm-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background:
          radial-gradient(ellipse at 80% 5%, #e6edcc88, transparent 45%),
          #faf9f2;
        color: #183e34;
        font:
          700 14px/1.6 system-ui,
          sans-serif;
      }
      #tm-boot i {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid #dce2d5;
        border-top-color: #21644c;
        animation: tm-boot-spin 0.8s linear infinite;
      }
      @keyframes tm-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tm-boot i {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="tm-boot"><i></i>Tus’Mon arrive…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
